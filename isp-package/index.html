.dchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 var(--pad) 8px}
.wfn{flex:1;display:flex;min-height:0;min-width:0}
.wfn-main{flex:1;min-width:0;display:flex;flex-direction:column}
.wfh{padding:12px var(--pad) 8px;display:flex;flex-direction:column;gap:6px}
.wft{display:flex;align-items:center;gap:8px;font-size:var(--wiz-text-h4-size)}
.aux{flex:none;position:relative;border-left:1px solid var(--wiz-grey-30);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.aux .spl{position:absolute;left:0;top:0;bottom:0}
.abody{overflow:auto}
.cn{background:var(--wiz-yellow-10);border:1px solid var(--wiz-main-warning);color:var(--wiz-yellow-90);border-radius:8px;padding:8px 10px;font-size:var(--wiz-text-caption-size)}
.rvwrap{flex:1;display:flex;flex-direction:column;min-height:0}
.segs{display:flex;gap:4px;padding:8px 16px;border-bottom:1px solid var(--wiz-grey-30);flex:none}
.seg{height:32px;padding:0 12px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;font-size:var(--wiz-text-body-2-size);color:var(--wiz-grey-80)}
.seg:hover{background:var(--wiz-grey-20)}.seg.on{background:var(--wiz-grey-20);color:var(--wiz-grey-90);font-weight:var(--wiz-font-weight-medium)}
.rvw{flex:1;display:flex;min-height:0;min-width:0}
.rvp{display:flex;flex-direction:column;min-width:0;min-height:0;flex:none;border-right:1px solid var(--wiz-grey-30)}
.rvp.fx{flex:1;border-right:0;min-width:240px}
.rvp:last-child{border-right:0}
.rvh{height:44px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--wiz-grey-30);flex:none;gap:8px}
.rvb{flex:1;min-height:0;overflow:auto}
.rvo{width:40px;flex:none;display:flex;justify-content:center;padding-top:6px;border-right:1px solid var(--wiz-grey-30)}
.olt-l{padding:8px;display:flex;flex-direction:column;gap:2px}
.olt{border:0;background:transparent;text-align:left;height:32px;padding:0 8px;border-radius:8px;display:flex;align-items:center;gap:8px;font:var(--wiz-text-body-2-size) var(--wiz-font-family-ui);cursor:pointer;color:var(--wiz-grey-90)}
.olt:hover{background:var(--wiz-grey-20)}.olt.on{background:var(--wiz-brand-blue-10);color:var(--wiz-brand-blue-70);font-weight:var(--wiz-font-weight-medium)}
.olt .on-n{color:var(--wiz-grey-80);min-width:28px}.olt .ok-i{margin-left:auto;color:var(--wiz-main-success);display:inline-flex}
.sapt{padding:16px 20px;font-size:var(--wiz-text-body-1-size);line-height:1.65}.sapt h3{margin:0 0 8px;font-size:var(--wiz-text-h5-size)}
.sapt p{margin:0 0 10px}.hlp{background:var(--wiz-yellow-10);border-radius:4px;padding:2px 4px}
.oi{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--wiz-grey-30);font-size:var(--wiz-text-body-2-size)}
.canvas{padding:20px;background:var(--wiz-grey-10);min-height:100%}
.shl{background:var(--wiz-main-white);border:1px solid var(--wiz-grey-40);padding:16px 20px;max-width:640px;margin:0 auto;font-size:var(--wiz-text-caption-size)}
.shl-t{font-weight:var(--wiz-font-weight-semibold);text-align:center}.shl-s{text-align:center;margin-bottom:12px}
.shl table{width:100%;border-collapse:collapse}.shl th,.shl td{border-top:1px solid var(--wiz-grey-90);padding:4px 6px;text-align:left}
.shl th span{font-weight:var(--wiz-font-weight-regular);color:var(--wiz-grey-80)}.shl-f{margin-top:8px;color:var(--wiz-grey-80)}
.code{margin:0;padding:12px 16px;font:var(--wiz-text-caption-size)/1.6 var(--wiz-font-family-mono);white-space:pre;overflow:auto;background:var(--wiz-grey-10);height:100%}
.gen{margin:auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px;text-align:center;color:var(--wiz-grey-80);font-size:var(--wiz-text-body-2-size)}
.gen b{color:var(--wiz-grey-90);font-size:var(--wiz-text-body-1-size)}
.cfmb{position:absolute;right:0;top:40px;width:320px;background:var(--wiz-main-white);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:14px 16px;display:flex;flex-direction:column;gap:8px;z-index:60;font-size:var(--wiz-text-body-2-size);white-space:normal;color:var(--wiz-grey-90)}
.cfmb span{color:var(--wiz-grey-80);line-height:1.5}.cfmb div{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.hdr:has(.steps) .lh{flex:1 1 0;min-width:0;overflow:hidden}
.hdr:has(.steps) .crumb{min-width:0;overflow:hidden;white-space:nowrap}
.hdr:has(.steps) .steps{position:static;transform:none;flex:none}
.hdr:has(.steps) .acts{flex:1 1 0;min-width:fit-content;display:flex;align-items:center;justify-content:flex-end;gap:8px}
.rvf{display:block;width:100%;height:100vh;min-height:0;border:0;background:var(--wiz-grey-20)}.crumb a:hover{color:var(--wiz-brand-blue-70)}

.rq{grid-template-columns:110px minmax(0,1fr)}
.warnt{color:var(--wiz-yellow-90)}
.wfh{padding:8px var(--pad) 4px}
.wft{font-size:var(--wiz-text-h5-size);gap:10px}.wft .sm{font-size:var(--wiz-text-body-2-size)}
.wfn-main .tabs{margin-top:4px}

const S = {

  asset: id => DB.assets.find(a => a.id === id),
  ds: id => DB.datasets.find(d => d.id === id),

  placeholdersOf: sid => DB.assets.filter(a => a.studyId === sid && a.required && !a.versions.length),
  datasetsOf: (sid, space) => DB.datasets.filter(d => d.studyId === sid && (!space || d.space === space)),
  latest: x => x.versions[0],
  vOf: (x, n) => x.versions.find(v => v.n === n),
  assetUsers: (a, n) => DB.events.filter(e => e.refs.assets[a.id] && (n == null || e.refs.assets[a.id].v === n)),
  dsUsers: (d, n) => DB.events.filter(e => e.refs.datasets[d.id] && (n == null || e.refs.datasets[d.id].v === n)),
  newerAssetRefs(e) { return Object.keys(e.refs.assets).map(id => ({ a: S.asset(id), ref: e.refs.assets[id] })).filter(x => x.a && S.latest(x.a).n > x.ref.v); },
  newerDsRefs(e) { return Object.keys(e.refs.datasets).map(id => ({ d: S.ds(id), ref: e.refs.datasets[id] })).filter(x => x.d && S.latest(x.d).n > x.ref.v); },
  pinnedDs(e, space) { return Object.keys(e.refs.datasets).map(id => ({ d: S.ds(id), ref: e.refs.datasets[id] })).filter(x => x.d && (!space || x.d.space === space)); },
  pinnedAssets(e) { return Object.keys(e.refs.assets).map(id => ({ a: S.asset(id), ref: e.refs.assets[id] })).filter(x => x.a); },
  producedCount: e => e.produced.length,
  touchRecent(eid) { DB.recent = [eid].concat(DB.recent.filter(x => x !== eid)); },

};
/* Workflow instance state is DERIVED from the node states in event.flow (single source of truth shared with Overview). */
function wfInfo(e, w) {
  const f = e.flow, ids = LOOP_NODES[w.loop], st = ids.map(id => f.st[id]);
  const locked = st.filter(x => x === 'locked').length;
  let status = 'Not started';
  if (st.some(x => x === 'running')) status = 'Running';
  else if (st.some(x => x === 'review')) status = 'In review';
  else if (st.some(x => x === 'stale')) status = 'Update available';
  else if (locked === ids.length) status = 'Locked';
  else if (locked > 0) status = 'In progress';
  const last = ids.filter(id => f.st[id] !== 'empty').slice(-1)[0];
  return { total: ids.length, locked, status, ids, last };
}

0Q836 125 798 108L762 92Q752 87 748.5 77.5Q745 68 748.5 58.0Q752 48 762 44L800 27Q837 10 866.0 -19.0Q895 -48 911 -86L923 -114Q928 -124 937.5 -127.5Q947 -131 956.5 -127.5Q966 -124 970 -114Z\"><\/path><\/svg><\/span>Copilot<\/span><span style=\"display:flex;gap:4px\"><button class=\"ibtn sm\" aria-label=\"New chat\" title=\"New chat\" onClick=\"{{ newChat }}\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14 3V5H4V18.3851L5.76282 17H20V10H22V18C22 18.5523 21.5523 19 21 19H6.45455L2 22.5V4C2 3.44772 2.44772 3 3 3H14ZM19 3V0H21V3H24V5H21V8H19V5H16V3H19Z\"><\/path><\/svg><\/button><button class=\"ibtn sm\" aria-label=\"Close Copilot\" title=\"Close Copilot\" onClick=\"{{ toggleCopilot }}\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z\"><\/path><\/svg><\/button><\/span><\/div>\n    <sc-if value=\"{{ hasSent }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"msgs\" style=\"flex:none;max-height:45%\">\n        <sc-for list=\"{{ sent }}\" as=\"m\" hint-placeholder-count=\"1\">\n          <div class=\"mu\"><b>{{ m.title }}<\/b><sc-for list=\"{{ m.items }}\" as=\"t\" hint-placeholder-count=\"2\"><div style=\"margin-top:4px\"><span class=\"meta\">{{ t.label }}<\/span><br>{{ t.text }}<\/div><\/sc-for><\/div>\n        <\/sc-for>\n      <\/div>\n    <\/sc-if>\n    <sc-if value=\"{{ isToc }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"msgs\">\n        <div class=\"mu\">Check \u00a74.2.3: does every output have SAP support?<\/div>\n        <div class=\"ma\">6 variables in \"Summary of Other Baseline Characteristics\" have no matching description in SAP \u00a74.2.3; their only source is the Shell document:\n          <ul><li>Prior surgical history<\/li><li>Smoking status<\/li><li>Alcohol use<\/li><li>Blood donation / blood loss<\/li><li>Participation in other clinical trials<\/li><li>Vaccine use<\/li><\/ul>\n          <div style=\"margin-top:8px\">The other 11 variables can all be found in P182. Whether to keep them is your call.<\/div>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n    <sc-if value=\"{{ isShell }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"msgs\"><\/div>\n      <sc-if value=\"{{ shell.hasSel }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 16px 8px\"><span class=\"badge\" title=\"{{ shell.sel.name }}\" style=\"max-width:100%;overflow:hidden;text-overflow:ellipsis\">{{ shell.sel.name }}<\/span><\/div><\/sc-if>\n    <\/sc-if>\n    <sc-if value=\"{{ isLb }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"msgs\">\n        <div class=\"meta\">Session: {{ lb.title }}<\/div>\n        <div class=\"mu\">Remove Median from the statistics of Age<\/div>\n        <div class=\"ma\">Shell is read-only in this step. Adding or removing statistics changes the scientific meaning of the Shell, so go back to the Shell step to edit and re-confirm. What you can change directly in Code is the implementation layer: macro parameters, filter syntax, comments and formatting.<\/div>\n      <\/div>\n      <sc-if value=\"{{ lb.hasSel }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 16px 8px\"><span class=\"badge\" style=\"max-width:100%;overflow:hidden;text-overflow:ellipsis\">{{ lb.selName }}<\/span><\/div><\/sc-if>\n    <\/sc-if>\n    <div class=\"cmp\"><span>Ask Copilot<\/span><button class=\"ibtn\" aria-label=\"Send\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M13.0001 7.82843V20H11.0001V7.82843L5.63614 13.1924L4.22192 11.7782L12.0001 4L19.7783 11.7782L18.3641 13.1924L13.0001 7.82843Z\"><\/path><\/svg><\/button><\/div>\n  <\/aside>\n  <\/sc-if>\n<\/div>\n<\/x-dc>\n\n<\/script><script type=\"text/plain\" id=\"bj\">\n// ---- shared layer: all steps share one state; each step keeps its own logic in its own Part ----\nconst snap4 = (w) => Math.round(w / 4) * 4;\nconst olType = (no) => { const k = String(no).split('.')[0]; return k === '16' ? 'listing' : (k === '15' ? 'figure' : 'table'); };\n// Outline row:[type icon] no. title \u2026\u2026 [status slot]; only one status slot, priority Locked > Warning > Edited > Done > empty\nconst olRow = (o) => {\n  const t = olType(o.no), st = o.st || 'pending';\n  const txt = { locked: 'Locked', warn: o.warnText || '', edited: 'Edited', reviewed: o.doneText || '' }[st] || '';\n  return {\n    no: o.no, title: o.title, cls: o.on ? 'on' : '', cur: o.on ? 'true' : 'false', off: !!o.off,\n    isTable: t === 'table', isListing: t === 'listing', isFigure: t === 'figure', typeLabel: t === 'table' ? 'Table' : (t === 'listing' ? 'Listing' : 'Figure'),\n    sLock: st === 'locked', sWarn: st === 'warn', sEdit: st === 'edited', sDone: st === 'reviewed', stText: txt,\n    pick: o.pick || (() => {})\n  };\n};\nconst olGroup = (g, rows, ogx, set) => {\n  const done = rows.filter((r) => r.sDone || r.sLock).length, all = rows.length > 0 && done === rows.length;\n  const open = !ogx[g.id];\n  return { id: g.id, no: g.no, title: g.title, rows, open, closed: !open, allDone: all, showCount: !all, count: done + '/' + rows.length, toggle: () => set(g.id) };\n};\nclass Part {\n  constructor(host) { this.host = host; this._s = {}; }\n  get state() { return this._s; }\n  set state(v) { this._s = v; }\n  get props() { return this.host.props; }\n  // Splitter:absolute delta + clamp; max = current width + the width the adjacent flexible panel can still give up (panels never get pushed off screen)\n  splitter(key, cfg) {\n    const H = this.host, el = (id) => document.getElementById(id);\n    const read = () => { const p = el(cfg.pid), n = el(cfg.nid); return { w: p ? p.getBoundingClientRect().width : cfg.now(), nw: n ? n.getBoundingClientRect().width : 1e4 }; };\n    const cap = (r) => Math.max(cfg.min, Math.min(cfg.max, r.w + r.nw - cfg.nmin()));\n    return {\n      now: Math.round(cfg.now()), min: cfg.min, max: cfg.max, cls: H.state.drag === key ? 'drag' : '',\n      down: (e) => {\n        e.preventDefault();\n        const r = read(), x0 = e.clientX, mx = cap(r);\n        H.setState({ drag: key });\n        const mv = (ev) => cfg.set(Math.round(Math.max(cfg.min, Math.min(mx, r.w + cfg.dir * (ev.clientX - x0)))));\n        const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); document.body.style.cursor = ''; document.body.style.userSelect = ''; H.setState({ drag: null }); };\n        document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);\n        document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';\n      },\n      key: (e) => {\n        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n        e.preventDefault();\n        const r = read();\n        cfg.set(Math.round(Math.max(cfg.min, Math.min(cap(r), r.w + cfg.dir * (e.key === 'ArrowRight' ? 16 : -16)))));\n      }\n    };\n  }\n  setState(u) {\n    const nx = typeof u === 'function' ? u(this._s) : u;\n    if (nx) this._s = Object.assign({}, this._s, nx);\n    this.host.forceUpdate();\n  }\n}\nconst SAP = (t) => [{ k: 'sap', t }];\nconst SHELL_ONLY = [{ k: 'shell', t: 'Shell' }];\nconst V = (name, src) => ({ name, src });\n\nconst PARAS = [\n  { id: 'P180', kind: '', segs: [\n    { t: 'Based on the FAS, ', c: ['i1', 'i2', 'i3', 'i4'] },\n    { t: 'descriptive statistics of the following demographic and baseline characteristics of participants are presented by sequence and in total, including:', c: ['i1', 'i2'] } ] },\n  { id: 'P181', kind: 'li', segs: [{ t: 'Demographics: age, sex, fertility potential (females only), race, ethnicity, height, weight, BMI;', c: ['i1', 'i3'] }] },\n  { id: 'P182', kind: 'li', segs: [{ t: 'Other baseline characteristics: presence of past or current medical history, presence of prior medication history, presence of allergy history, infectious disease screening, urine drug abuse screening, alcohol breath test, chest PA X-ray, nicotine screening, T-SPOT;', c: ['i2', 'i4'] }] },\n  { id: 'P183', kind: '', segs: [{ t: 'The listing presents participant demographics and other baseline characteristics.', c: ['i3', 'i4'] }] }\n];\nconst PTEXT = {};\nPARAS.forEach((p) => { PTEXT[p.id] = p.segs.map((s) => s.t).join(''); });\nconst snip = (id) => { const t = PTEXT[id] || ''; return t.length > 70 ? t.slice(0, 70) + '\u2026' : t; };\n\nconst WHY_FAS = 'SAP P180 says \"Based on the FAS\"; FAS is defined in SAP \u00a73, Table 7.';\nconst BASE = [\n  { id: 'i1', no: '14.1.3.1', title: 'Summary of Demographics \u2014 Full Analysis Set', type: 'Table', listing: false,\n    pop: 'FAS', popSrc: SAP('P180'), why: WHY_FAS,\n    scope: 'Population and reporting object as defined by this item', scopeSrc: SAP('P180'),\n    present: 'By sequence and Total; each variable shown as continuous or categorical', presentSrc: SAP('P180'),\n    vars: ['Age (years)', 'Sex, n (%)', 'If female, of childbearing potential, n(%) (females only)', 'Race, n (%)', 'Ethnicity, n (%)', 'Height (cm)', 'Weight (kg)', 'BMI'].map((n) => V(n, SAP('P181'))) },\n  { id: 'i2', no: '14.1.3.2', title: 'Summary of Other Baseline Characteristics \u2014 Full Analysis Set', type: 'Table', listing: false,\n    pop: 'FAS', popSrc: SAP('P180'), why: WHY_FAS,\n    scope: 'Population and reporting object as defined by this item', scopeSrc: SAP('P180'),\n    present: 'By sequence and Total; each variable shown as continuous or categorical', presentSrc: SAP('P180'),\n    vars: [\n      V('Any past/current medical history?, n (%)', SAP('P182')),\n      V('Any prior medication history?, n (%)', SAP('P182')),\n      V('Any prior surgical history?, n (%)', SHELL_ONLY),\n      V('Smoked \u22651 cigarette daily within 3 months before screening, or unable to stop all tobacco products during the study?, n (%)', SHELL_ON   const f = e.flow; delete f.note[id]; f.st[id] = 'locked'; f.ui.edge = null;
  toast('Kept ' + NODE[id].name + ' v' + f.ver[id] + ', decision recorded');

function ovDoReplace(e, id) {
  const f = e.flow; f.st[id] = 'locked'; f.ver[id] += 1; delete f.note[id];
  DOWN[id].forEach(d => { if (f.st[d] === 'locked') { f.st[d] = 'stale'; f.note[d] = (NODE[id].file || NODE[id].name) + ' v' + f.ver[id] + ' available'; } });
  const changed = DOWN[id].filter(d => f.st[d] === 'stale').map(d => NODE[d].name);
  f.ui.confirm = null; e.updated = dLong();
  toast((NODE[id].file || NODE[id].name) + ' v' + f.ver[id] + ' uploaded' + (changed.length ? ', ' + changed.join(', ') + ' update available' : ''));
}
function ovStartOrFix(e, id) {
  const C = ovCtx(e), f = e.flow, d = C.disp(id), loop = LOOP_OF[id], w = S.wf(e, loop);
  if (d === 'ready') { if (!w) return openNewWorkflow(e, loop); return go(hrefWf(e.id, w.id, id)); }
  if (d === 'stale') { if (!C.inputsLocked(id)) return toast('Update upstream steps first'); ovRun(e, id); if (w) go(hrefWf(e.id, w.id, id)); return; }
  if (d === 'review') { const h = reviewHref(e, id); return h ? go(h) : toast('Package review is not in this prototype'); }
  if (d === 'running') return w ? go(hrefWf(e.id, w.id, id)) : toast(NODE[id].name + ' is running, ' + f.prog[id] + '/24');
  if (d === 'locked') return go('#/event/' + enc(e.id) + '/asset');
  const miss = NODE[id].inputs.filter(i => f.st[i] !== 'locked').map(i => NODE[i].name);
  toast('Waiting for ' + miss.join(' + '));
}

     #/event/:eid/workflow/:wfid[/:node]    node page (Generate Shell board 10 / Generate Code board 11)

let R = { name: 'studies' };
const PW0 = { cop: 360, drawer: 440, aux: 400, out: 220, rt: 440, shell: 560 };
const UI = { pw: Object.assign({}, PW0), cop: { open: false, msgs: [], draft: '', seen: {} }, nav: { review: false }, rv: { outline: true, step: null }, drag: null, rvSnap: {}, rvFrame: null, menu: null, drawer: null, q: {}, qOpen: {}, f: {}, hl: null, studyNewDone: null };

function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '').split('?')[0];
  const seg = h.split('/').filter(Boolean).map(decodeURIComponent);
  if (!seg.length || seg[0] === 'studies') return seg[1] === 'new' ? { name: 'studyNew' } : { name: 'studies' };
  if (seg[0] === 'study' && seg[1]) return { name: 'study', sid: seg[1], tab: seg[2] || 'events', space: seg[3] || null };
  if (seg[0] === 'event' && seg[1]) return { name: 'event', eid: seg[1], tab: seg[2] || 'overview', space: seg[3] || null, sub: seg[3] || null, node: seg[4] || null };
  return { name: 'studies' };
}
let _pending = null;
function go(hash, opts) {
  _pending = opts || null;
  if (location.hash === hash) { onRoute(); } else location.hash = hash;
}
function onRoute() {
  R = parseRoute();
  if (R.name === 'event' && R.tab === 'workflow' && R.sub === 'new' && S.event(R.eid)) { const eid = R.eid; history.replaceState(null, '', hrefEvent(eid, 'workflow')); R = parseRoute(); R.openNew = true; }

/* ---------- splitter (DS 5.0 §1.5): 2px, transparent, 10px hit area, blue-70 on hover(200ms)/drag/focus; arrows ±16; max = current + what the flexible neighbour can give up ---------- */
function spl(o) { // o: key,pid,nid,dir,min,max,nmin,gap,label
  const now = Math.round(UI.pw[o.key]);
  return `<div class="spl${o.gap ? ' gap' : ''}${UI.drag === o.key ? ' drag' : ''}" role="separator" aria-orientation="vertical" aria-label="Resize ${esc(o.label)}" tabindex="0" aria-valuenow="${now}" aria-valuemin="${o.min}" aria-valuemax="${o.max}" data-spl="${o.key}" data-pid="${o.pid}" data-nid="${o.nid}" data-dir="${o.dir}" data-min="${o.min}" data-max="${o.max}" data-nmin="${o.nmin}"${o.overlay ? ' data-overlay="1"' : ''}></div>`;
}
function splStart(el, x0) {
  const key = el.dataset.spl, p = document.getElementById(el.dataset.pid), n = document.getElementById(el.dataset.nid);
  if (!p) return null;
  const cfg = { key, p, n, dir: +el.dataset.dir, min: +el.dataset.min, max: +el.dataset.max, nmin: +el.dataset.nmin };
  cfg.w0 = p.getBoundingClientRect().width; cfg.nw0 = n ? n.getBoundingClientRect().width : 1e4; cfg.x0 = x0; cfg.el = el;
  cfg.cap = el.dataset.overlay ? Math.max(cfg.min, Math.min(cfg.max, cfg.nw0 - cfg.nmin)) : Math.max(cfg.min, Math.min(cfg.max, cfg.w0 + cfg.nw0 - cfg.nmin));
  return cfg;
}
function splApply(c, w) {
  w = Math.round(Math.max(c.min, Math.min(c.cap, w))); UI.pw[c.key] = w; c.p.style.width = w + 'px'; c.el.setAttribute('aria-valuenow', w); return w;
}
document.addEventListener('mousedown', ev => {
  const el = ev.target.closest && ev.target.closest('[data-spl]'); if (!el) return;
  ev.preventDefault(); const c = splStart(el, ev.clientX); if (!c) return;
  UI.drag = c.key; el.classList.add('drag'); document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none'; document.body.classList.add('dragging');
  const mv = e2 => splApply(c, c.w0 + c.dir * (e2.clientX - c.x0));
  const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); document.body.style.cursor = ''; document.body.style.userSelect = ''; document.body.classList.remove('dragging'); el.classList.remove('drag'); UI.drag = null; };
  document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
});
document.addEventListener('keydown', ev => {
  const el = ev.target.closest && ev.target.closest('[data-spl]'); if (!el || (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight')) return;
  ev.preventDefault(); const c = splStart(el, 0); if (!c) return;
  splApply(c, c.w0 + c.dir * (ev.key === 'ArrowRight' ? 16 : -16));
});

  const cat = UI.f.assetCat || 'All', tp = UI.f.assetType || 'All';

        <span class="sm">${users.length ? eventsLbl(users.length) : '—'}${behind ? ` <span class="badge warn">${behind} behind</span>` : ''}</span><span class="sm">${esc(lv.date)}</span>
        ${moreBtn(a.name, 'm:' + a.id, [{ t: 'Open Versions', act: 'drawer', a: 'assetV|' + a.id }, { t: 'Upload New Version', act: 'uploadVersion', a: a.id }, { t: 'Download…', dis: true }])}</div>`;

/* ---------- event shell ---------- */
function eventCounts(e) { return { asset: Object.keys(e.refs.assets).length + e.produced.length, ds: Object.keys(e.refs.datasets).length }; }

function pEvent() {

  if (R.tab === 'overview' && !p.pcls) { /* overview keeps its own scroll model */ }
  return shell(Object.assign({ crumb: crumbStudy(s, false) + crumbEvent(e, true), tabs: evTabs(e, R.tab) }, p));
}

  <div class="dbody"><div class="kv"><span class="k">Dataset</span><span>${esc(d.name)} ${esc(d.label)}</span><span></span></div><div class="kv"><span class="k">Category</span><span>${esc(d.cat)}, ${SPACE(d.space).name} space</span><span></span></div>
  <div class="phead" style="margin-top:8px"><span class="ptitle">Versions <i>${d.versions.length}</i></span></div>
  ${d.versions.map((v, i) => `<div class="vr pin"><div><div class="l1">${v.label} ${i === 0 ? '<span class="badge">Latest</span>' : ''}${v.n === ref.v ? '<span class="badge blue">Pinned</span>' : ''}</div><div class="l2">${esc(v.by)}, ${esc(v.date)}${v.note ? ', ' + esc(v.note) : ''}</div></div><span>${v.n === ref.v ? '' : `<button class="btn" style="height:28px;white-space:nowrap" data-act="usePinDs" data-a="${e.id}|${d.id}|${v.n}">Use this version</button>`}</span></div>`).join('')}</div></aside>`;

/* ---------- render ---------- */
function render() {
  const app = $('#app'); if (!app) return;
  if (R.name === 'event' && R.tab === 'review' && UI.rvFrame && UI.rvFrame.eid === R.eid && $('#rvf')) { /* keep the Review frame (and its state) alive across store re-renders; only push node status into it */
    const fe = S.event(R.eid), fw = $('#rvf').contentWindow; if (fe && fw) fw.postMessage({ rv: 1, t: 'st', toc: fe.flow.st.toc, shell: fe.flow.st.shell }, '*');
    return;
  }
  const ae = document.activeElement, copFocus = ae && ae.id === 'cop-in', caret = copFocus ? ae.selectionStart : 0;
  const sc = $('.scroll'), st = sc ? sc.scrollTop : 0, dsc = $('.dr .dbody'), dst = dsc ? dsc.scrollTop : 0;
  const ms0 = $('#cop-msgs'), mst = ms0 ? ms0.scrollTop : 0;
  let html;
  if (R.name === 'studies') html = pStudies();
  else if (R.name === 'studyNew') html = typeof pStudyNew === 'function' ? pStudyNew() : shell({ label: 'New Study', crumb: '<b>New Study</b>', body: placeholder('Create Study', ['Arrives in phase 2.']) });
  else if (R.name === 'study') html = pStudy();
  else html = pEvent();
  app.innerHTML = html;
  const sc2 = $('.scroll'); if (sc2 && st) sc2.scrollTop = st;
  const d2 = $('.dr .dbody'); if (d2 && dst) d2.scrollTop = dst;
  const ms = $('#cop-msgs'); if (ms) ms.scrollTop = UI.cop.scroll ? ms.scrollHeight : mst; UI.cop.scroll = false;
  if (copFocus) { const t = $('#cop-in'); if (t) { t.focus(); t.setSelectionRange(caret, caret); } }
  document.title = 'ISP Prototype';
}

/* ---------- actions ---------- */

  cx: (a, el, ctx) => { UI.menu = ctx.prevMenu; UI.cx = UI.cx || {}; const cur = a in UI.cx ? UI.cx[a] : false; UI.cx[a] = !cur; },
  filter: a => { const [k, v] = a.split('|'); UI.f[k] = v; },

  copilotClose: () => { UI.cop.open = false; },
  copNew: () => { UI.cop.msgs = []; UI.cop.draft = ''; UI.cop.key = null; UI.cop.seen = {}; UI.cop.msgs = [{ r: 'a', t: 'New conversation. Ask about what is on this page.' }]; UI.cop.fresh = true; },
  copSend: () => { const t = (UI.cop.draft || '').trim(); if (!t) return false; UI.cop.msgs.push({ r: 'u', t }, { r: 'a', t: 'Demo reply: Copilot answers are not connected in this prototype.' }); UI.cop.draft = ''; UI.cop.scroll = true; },
  navToggle: () => { UI.nav.review = !UI.nav.review; },
  createEvent: () => { call('openCreateEvent'); return false; },
  uploadFile: a => { call('openUploadAsset', { code: a || '' }); return false; },
  uploadVersion: a => { call('openUploadAsset', { assetId: a }); return false; },
  uploadDataset: a => { call('openUploadDataset', { mode: a || '' }); return false; },

    if (as.code === 'SAP') ovOnSapPinChanged(e, vLabel(as, +n));

  },
  usePinDs: a => {

    e.refs.datasets[did].v = +n; e.updated = dLong();
    toast('Adopted ' + d.name + ' ' + vLabel(d, +n) + '. Existing Run snapshots stay unchanged.');
  },
  /* Overview */
  'ov.sel': a => { const f = S.event(R.eid).flow; f.ui.sel = a; f.ui.edge = null; f.ui.confirm = null; },
  'ov.clear': () => { const f = S.event(R.eid).flow; f.ui.sel = null; f.ui.edge = null; f.ui.confirm = null; },
  'ov.close': () => { const f = S.event(R.eid).flow; f.ui.sel = null; f.ui.confirm = null; },
  'ov.edge': a => { const f = S.event(R.eid).flow; f.ui.edge = f.ui.edge === a ? null : a; f.ui.sel = null; f.ui.confirm = null; },
  'ov.toggleInputs': () => { const f = S.event(R.eid).flow; f.ui.inputsOpen = !f.ui.inputsOpen; },
  'ov.replaceAsk': a => { const ee = S.event(R.eid); if (ee.flow.st[a] === 'running' || ee.flow.st[a] === 'review') return false; ee.flow.ui.confirm = a; },
  'ov.replaceDo': a => ovDoReplace(S.event(R.eid), a),
  'ov.cancel': () => { S.event(R.eid).flow.ui.confirm = null; },
  'ov.start': a => ovStartOrFix(S.event(R.eid), a),
  'ov.run': a => ovRun(S.event(R.eid), a),
  'ov.lock': a => ovLock(S.event(R.eid), a),
  'ov.keep': a => ovKeep(S.event(R.eid), a),
  'ov.jumpAsset': a => { go(hrefEvent(R.eid, 'asset'), { hl: { kind: 'asset', id: a } }); return false; },
  'ov.jumpEventAsset': () => { go(hrefEvent(R.eid, 'asset')); return false; },
  'ov.jumpDs': a => { go(hrefEvent(R.eid, 'dataset', a)); return false; },
  'ov.refAsset': a => { call('openRefAsset', R.eid, a, null); return false; },
  'ov.pinAsset': a => { go(hrefEvent(R.eid, 'asset'), { drawer: { kind: 'assetPin', id: a } }); return false; },
  'ds.up': a => { pickDsFile(a); return false; },
  'ov.pinDs': a => { go(hrefEvent(R.eid, 'dataset', a || 'dummy')); return false; },
  'ov.jumpWf': () => { go(hrefEvent(R.eid, 'workflow')); return false; }
};
function dispatch(el, ctx) {
  const name = el.getAttribute('data-act'), fn = A[name]; if (!fn) return;
  const r = fn(el.getAttribute('data-a') || '', el, ctx);
  return r;
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) { if (UI.menu) { UI.menu = null; render(); } return; }
  if (el.tagName === 'A' && !el.getAttribute('href')) ev.preventDefault();
  const ctx = { prevMenu: UI.menu }; UI.menu = null;
  const r = dispatch(el, ctx);
  if (r !== false) render();
  if (UI.focus) { const f = $(UI.focus); if (f) f.focus(); UI.focus = null; }
});
document.addEventListener('input', ev => {
  const t = ev.target; if (!t.matches || !t.matches('[data-search]')) return;
  const k = t.getAttribute('data-search'); UI.q[k] = t.value; render();
  const f = $('[data-search="' + k + '"]'); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
});
document.addEventListener('input', ev => { const t = ev.target; if (t && t.id === 'cop-in') { UI.cop.draft = t.value; t.style.height = 'auto'; t.style.height = Math.min(120, t.scrollHeight) + 'px'; } });
document.addEventListener('keydown', ev => { const t = ev.target; if (t && t.id === 'cop-in' && ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); A.copSend(); render(); const n = $('#cop-in'); if (n) n.focus(); } });
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (typeof closeModal === 'function' && $('#modal-root').firstChild) { closeModal(); return; }
  if (UI.menu) { UI.menu = null; render(); return; }
  if (UI.drawer) { UI.drawer = null; render(); }
});
window.addEventListener('hashchange', () => { UI.rvFrame = null; onRoute(); });

/* =========================================================
   Phase 2 — Create Event dialog, Upload (asset / dataset) dialogs,
   Create Study page. Business fields follow PM inventory (02-字段表.md).

const MD = { kind: null, st: null };
const mroot = () => $('#modal-root');
function openModal(kind, st) { MD.kind = kind; MD.st = st; renderModal(); setTimeout(() => { const f = $('#modal-root [data-autofocus]'); if (f) f.focus(); }, 0); }
function closeModal() { MD.kind = null; MD.st = null; mroot().innerHTML = ''; }
function renderModal() {
  const root = mroot(); if (!MD.kind) { root.innerHTML = ''; return; }
  const old = $('#modal-root .db'), st = old ? old.scrollTop : 0;
  root.innerHTML = MD.kind === 'createEvent' ? mCreateEvent() : MD.kind === 'uploadAsset' ? mUploadAsset() : MD.kind === 'newWorkflow' ? mNewWorkflow() : MD.kind === 'pickDs' ? mPickDs() : MD.kind === 'refAsset' ? mRefAsset() : mUploadDataset();
  const nb = $('#modal-root .db'); if (nb) nb.scrollTop = st;
}

/* ----- form atoms ----- */
const fld = (label, req, inner, o) => { o = o || {}; return `<div class="fld"${o.id ? ` id="${o.id}"` : ''}><label>${label}${req ? '<em>*</em>' : ''}</label>${inner}${o.err ? `<div class="err">${esc(o.err)}</div>` : (o.hint ? `<div class="hint">${o.hint}</div>` : '')}</div>`; };
const inp = (f, val, o) => { o = o || {}; return `<input class="inp${o.bad ? ' bad' : ''}" data-f="${f}" value="${esc(val)}"${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}${o.ro ? ' readonly' : ''}${o.max ? ` maxlength="${o.max}"` : ''}${o.af ? ' data-autofocus' : ''} autocomplete="off">`; };
const selH = (f, val, opts, o) => { o = o || {}; return `<select class="slc${o.bad ? ' bad' : ''}" data-f="${f}"${o.dis ? ' disabled' : ''}>${o.ph ? `<option value=""${val ? '' : ' selected'} disabled>${esc(o.ph)}</option>` : ''}${opts.map(x => Array.isArray(x) && x[2] === 'group' ? `<optgroup label="${esc(x[0])}">${x[1].map(y => `<option value="${esc(y[0])}"${y[0] === val ? ' selected' : ''}>${esc(y[1])}</option>`).join('')}</optgroup>` : `<option value="${esc(x[0])}"${x[0] === val ? ' selected' : ''}>${esc(x[1])}</option>`).join('')}</select>`; };
const txa = (f, val, o) => { o = o || {}; return `<textarea class="txa${o.bad ? ' bad' : ''}" data-f="${f}" maxlength="${o.max || 1000}" rows="${o.rows || 3}"${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}>${esc(val)}</textarea><div class="cnt2" data-cnt="${f}">${(val || '').length} / ${o.max || 1000}</div>`; };
const mHead = (t) => `<header><span>${esc(t)}</span><button class="ibtn" data-m="cancel" aria-label="Close">${ic('close')}</button></header>`;
const scrim = (label, inner, w) => `<div class="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(label)}"${w ? ` style="width:${w}px"` : ''}>${inner}</div></div>`;
const noCtl = s => /[\u0000-\u001f\u007f]/.test(s);

/* ================= Create Event ================= */
function openCreateEvent() {
  const sid = R.name === 'study' ? R.sid : (R.name === 'event' ? S.event(R.eid).studyId : null); if (!sid) return;
  const refs = {}, seen = {};
  S.assetsOf(sid).forEach(a => { if ((a.code === 'SAP' || a.code === 'CRF') && a.versions.length && !seen[a.code]) { seen[a.code] = 1; refs[a.id] = defaultVer(a); } });
  openModal('createEvent', { sid, name: '', goal: '', scope: 'EXPLORATORY', reason: '', refs, err: {} });
}
function defaultVer(a) { return S.latest(a).n; }
function mCreateEvent() {
  const st = MD.st, assets = S.assetsOf(st.sid), er = st.err, nSel = Object.keys(st.refs).length;
  const rows = assets.map(a => {
    const on = a.id in st.refs;
    const sel = on ? `<select class="slc" data-m-ver="${a.id}" aria-label="Version of ${esc(a.name)}">${a.versions.map((v, i) => `<option value="${v.n}"${st.refs[a.id] === v.n ? ' selected' : ''}>${[v.label, i === 0 ? 'Latest' : '', v.status === 'Official' ? 'Official' : ''].filter(Boolean).join(', ')}</option>`).join('')}</select>` : '<span></span>';
    return `<div class="pr2${on ? ' on' : ''}"><input type="checkbox" class="cbx" data-m="toggleRef" data-id="${a.id}" aria-label="Reference ${esc(a.name)}"${on ? ' checked' : ''}><span class="ell" title="${esc(a.name)}">${esc(a.name)}</span>${sel}</div>`;
  }).join('');
  const lbl = nSel ? `Reference Existing Assets <span class="lcn">${nSel}</span>` : 'Reference Existing Assets';
  const body = `<div class="db">
    ${fld('Event Name', true, inp('name', st.name, { ph: 'e.g. Primary Analysis', max: 200, bad: er.name, af: true }), { err: er.name })}
    ${fld('Analysis Objective', false, txa('goal', st.goal, { rows: 2, max: 1000, ph: 'What this Event should answer' }))}
    <div class="row2">${fld('Analysis Scope', false, selH('scope', st.scope, SCOPES))}
    ${fld('Event Owner', false, `<div class="ro"><span class="av">${DB.me.ini}</span>${esc(DB.me.name)}</div>`)}</div>
    ${fld(lbl, false, assets.length ? `<div class="pick c2"><div class="ph"><span></span><span>Asset</span><span>Version</span></div><div class="pb2">${rows}</div></div>` : '<div class="note3">This Study has no assets yet. Upload files first, then create the Event.</div>')}
    ${fld('Reason for Change', true, txa('reason', st.reason, { rows: 2, max: 1000, bad: er.reason, ph: 'Why this Event is needed' }), { err: er.reason })}
  </div>`;
  return scrim('New Event', `${mHead('New Event')}${body}<footer><button class="btn" data-m="cancel">Cancel</button><button class="btn pri" data-m="submit">Create Event</button></footer>`);
}
function submitCreateEvent() {
  const st = MD.st, er = {};
  const name = st.name.trim(), reason = st.reason.trim();
  if (!name) er.name = 'Event name is required.'; else if (name.length > 200) er.name = 'Use 200 characters or fewer.'; else if (noCtl(name)) er.name = 'Remove control characters.';
  if (!reason) er.reason = 'Reason for change is required (1–1000 characters).'; else if (reason.length > 1000) er.reason = 'Use 1000 characters or fewer.';
  st.err = er; if (Object.keys(er).length) { renderModal(); const b = $('#modal-root .err'); if (b) b.scrollIntoView({ block: 'center' }); return; }
  const id = 'EVT-' + String(++DB.seq.event).padStart(3, '0');
  const refs = { assets: {}, datasets: {} };
  Object.keys(st.refs).forEach(aid => { refs.assets[aid] = { v: st.refs[aid], use: '—' }; });
  const e = { id, studyId: st.sid, name, status: 'In progress', owner: DB.me.name, goal: st.goal.trim(), scope: st.scope, reason, wfs: [], adopted: '—', updated: dLong(), members: 1, refs, produced: [], flow: newFlow({ ui: { sel: 'toc', edge: null, inputsOpen: true, confirm: null } }) };
  DB.events.unshift(e); S.study(st.sid).updated = dLong();
  closeModal();
  go(hrefEvent(id, 'overview'));
  const n = Object.keys(refs.assets).length;
  toast('Event created' + (n ? ', ' + plural(n, 'asset') + ' referenced' : ''));
}

/* ================= Upload asset / new version ================= */
const FILE_OK = ['pdf', 'docx', 'rtf', 'txt', 'csv', 'xlsx', 'sas', 'r', 'py', 'json', 'xml'];
const SHORT = { PROTOCOL: 'Protocol', SAP: 'SAP', CRF: 'CRF', ACRF: 'aCRF', ADAM_SPEC: 'ADaM Spec', SDTM_SPEC: 'SDTM Spec', TOC_TFL_DEFINITION: 'TOC', TABLE_SHELL: 'Shell', TFL_PRODUCTION_CODE: 'Prod. code' };
const extOf = n => (n.split('.').pop() || '').toLowerCase();
function openUploadAsset(o) {
  const sid = R.name === 'study' ? R.sid : null; if (!sid) return;
  const a = o.assetId ? S.asset(o.assetId) : null;
  const code = a ? a.code : (o.code || '');
  openModal('uploadAsset', { sid, asset: a ? a.id : null, code, name: a ? a.name : '', meta: {}, fileName: '', reason: '', err: {} });
}
function mUploadAsset() {
  const st = MD.st, er = st.err, a = st.asset ? S.asset(st.asset) : null, t = TYPE(st.code);
  const groups = CAT_ORDER.map(c => [c, TYPES.filter(x => x.cat === c).map(x => [x.code, x.name]), 'group']);
  const metaH = t ? (t.req.length ? `<div class="row2">${t.req.map(r => `<div class="fld"><label>${esc(r)}<em>*</em></label><input class="inp${er['m:' + r] ? ' bad' : ''}" data-meta="${esc(r)}" value="${esc(st.meta[r] || '')}" autocomplete="off">${er['m:' + r] ? `<div class="err">${esc(er['m:' + r])}</div>` : ''}</div>`).join('')}</div>` : '<div class="hint" style="font-size:var(--wiz-text-caption-size);color:var(--wiz-grey-70)">No required metadata for this type.</div>') : '<div class="hint" style="font-size:var(--wiz-text-caption-size);color:var(--wiz-grey-70)">Select a type to see its required metadata.</div>';
  const nextLabel = a ? 'v' + (S.latest(a).n + 1) : 'v1';
  const body = `<div class="db">
    ${a ? `<div class="note3">Adding a new version of <b>${esc(a.name)}</b> (currently ${S.latest(a).label}). Type is locked to the existing asset. The new version will be <b>${nextLabel}</b>.</div>` : ''}
    ${fld('File type', true, selH('code', st.code, groups, { ph: 'Select a type…', dis: !!a, bad: er.code }), { err: er.code, hint: a ? 'Locked when adding a version.' : 'From the 31 asset types. Write permission per role is checked by type.' })}
    ${fld('Name', true, inp('name', st.name, { ph: 'Filled from the file name if empty', max: 200, bad: er.name, ro: !!a }), { err: er.name })}
    <div class="fld"><div class="lb2">Metadata</div>${metaH}</div>
    ${fld('File', true, `<label class="fileb"><input type="file" data-m-file="asset" accept="${FILE_OK.map(x => '.' + x).join(',')}"><button class="btn" type="button" data-m="pickfile">${ic('upload')}Choose file…</button><span class="fn${st.fileName ? ' has' : ''}">${esc(st.fileName || 'No file chosen')}</span></label>`, { err: er.file, hint: 'Allowed: ' + FILE_OK.map(x => '.' + x).join(' ') })}
    ${fld('Reason', false, txa('reason', st.reason, { rows: 2, max: 1000, ph: a ? 'Defaults to "Appended file version"' : 'Optional' }))}
  </div>`;
  return scrim(a ? 'Upload New Version' : 'Upload File', `${mHead(a ? 'Upload New Version' : 'Upload File')}${body}<footer><span class="fnote">Version number is assigned automatically.</span><button class="btn" data-m="cancel">Cancel</button><button class="btn pri" data-m="submit">${a ? 'Upload version' : 'Upload'}</button></footer>`);
}
function submitUploadAsset() {
  const st = MD.st, er = {}, a = st.asset ? S.asset(st.asset) : null, t = TYPE(st.code);
  if (!t) er.code = 'Select a file type.';
  const name = st.name.trim(); if (!name) er.name = 'Enter a name or choose a file.';
  if (t) t.req.forEach(r => { if (!(st.meta[r] || '').trim()) er['m:' + r] = 'Required.'; });
  if (!st.fileName) er.file = 'Choose a file.'; else if (FILE_OK.indexOf(extOf(st.fileName)) < 0) er.file = 'Unsupported format. Allowed: ' + FILE_OK.map(x => '.' + x).join(' ');
  st.err = er; if (Object.keys(er).length) { renderModal(); const b = $('#modal-root .err'); if (b) b.scrollIntoView({ block: 'center' }); return; }
  const s = S.study(st.sid), note = st.reason.trim() || (a ? 'Appended file version' : 'Initial upload');
  let target = a;
  if (a) {
    const n = S.latest(a).n + 1; a.versions.unshift(V(n, DB.me.name, dShort(), note, { meta: Object.assign({}, st.meta), file: st.fileName }));
  } else {
    target = { id: 'A' + (++DB.seq.asset), studyId: st.sid, name, code: t.code, tl: SHORT[t.code] || t.name, icon: t.cat === 'Code & Scripts' ? 'code' : 'doc', source: 'Uploaded', versions: [V(1, DB.me.name, dShort(), note, { meta: Object.assign({}, st.meta), file: st.fileName })] };
    DB.assets.push(target);
    DB.assets = DB.assets.filter(x => !(x.required && x.studyId === st.sid && x.code === t.code)); // fills a "Required, Not uploaded" placeholder
  }
  s.updated = dLong();
  closeModal();
  toast((a ? 'New version ' : 'Uploaded ') + target.name + ' ' + S.latest(target).label);
  go(hrefStudy(st.sid, 'asset'), { drawer: { kind: 'assetV', id: target.id } });
}

/* ---------------- Dataset picker (Generate Code) ---------------- */

/* Dataset drop slots: ADaM and SDTM, click to choose a file and upload straight into this Event (Dummy space). */
const dsCnt = (e, c) => S.pinnedDs(e, 'dummy').filter(x => x.d.cat === c).length;
const dsByType = e => ['ADaM', 'SDTM'].map(c => [c, dsCnt(e, c)]).filter(x => x[1]).map(x => x[0] + ' ' + x[1]).join(', ');

  const b = c => { const n = ev ? dsCnt(ev, c) : 0; return `<button class="dz${n ? ' on' : ''}" ${a} data-cat="${c}" data-a="${c}" aria-label="${n ? 'Upload another ' + c + ' dataset, ' + n + ' uploaded' : 'Upload ' + c}">${n ? '' : ic('upload', 12)}${c}${n ? `<span class="dn">${n}</span>` : ''}</button>`; };

let DSFILE = null;

}
function quickUploadDs(cat, fileName) {
  const e = S.event(R.eid); if (!e) return;

  const stem = fileName.replace(/\.[^.]+$/, ''), nm = stem.toUpperCase().replace(/\s+/g, '_');

  else { d = { id: 'D' + (++DB.seq.ds), studyId: e.studyId, space: 'dummy', cat, name: nm, label: '', versions: [V(1, DB.me.name, dShort(), note, { file: fileName })] }; DB.datasets.push(d); }
  e.refs.datasets[d.id] = { v: S.latest(d).n, use: 'Generate Code' }; e.updated = dLong(); S.study(e.studyId).updated = dLong();
  toast(d.name + ' ' + S.latest(d).label + ' uploaded');

}
function mPickDs() {

document.addEventListener('click', ev => {
  const el = ev.target.closest('#modal-root [data-m]'); if (!el || !MD.st) return;

/* ---------------- Workflow tab ---------------- */
const WFGT = 'minmax(0,.7fr) 90px 140px minmax(0,1.6fr) 110px 120px';

/* ---------------- node pages (boards 10 / 11) ---------------- */
function nodeBtn(e, id) {

}

}

}

}

  ${d === 'running' ? `<div style="padding:12px 16px">${bar(f.prog[id], 24)}</div>` : ''}${act ? `<div style="padding:12px 16px">${act}</div>` : ''}</div></aside>`;

    <div class="dsh" style="padding:0 var(--pad)">Inputs</div>${rows}

  return { label: 'Workflow ' + w.id, crumb: rvCrumb(e, w), body: `<div class="wfn">${main}${wfAux(e, w, sel)}</div>` };

/* ---------------- Review workbench (board 17, ported verbatim, hosted in an iframe) ----------------
   Markup, CSS and component logic come from Review-ISP-en; RV_DOC is generated by build.py (see rvdoc.py).
   The SPA only supplies context (event, workflow, recent events) and receives commits (TOC reviewed, Shell confirmed, Code locked). */
const RV_STEP = { toc: 'toc', shell: 'shell', code: 'lb' };
const CODE_NODES = ['prodCode', 'qcCode', 'prodResult', 'qcResult'];
const genState = (what, pr) => `<div class="gen"><svg class="ic spin" style="width:24px;height:24px" viewBox="0 0 24 24"><path d="M18.364 5.63604L16.9497 7.05025C15.683 5.7835 13.933 5 12 5C8.13401 5 5 8.13401 5 12C5 15.866 8.13401 19 12 19C15.866 19 19 15.866 19 12H21C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C14.4853 3 16.7353 4.00736 18.364 5.63604Z"/></svg><b>Generating ${esc(what)}</b>${bar(pr, 24)}<span class="sm">${pr} of 24</span></div>`;
function rvStep(e) {
  if (R.sub) return R.sub;
  const C = ovCtx(e);
  return C.disp('toc') === 'review' ? 'toc' : C.disp('shell') === 'review' ? 'shell' : CODE_NODES.some(id => C.disp(id) === 'review') ? 'code' : 'toc';
}
function rvNode(e, step) {
  if (step === 'toc' || step === 'shell') return step;
  const C = ovCtx(e);
  return CODE_NODES.includes(R.node) ? R.node : (CODE_NODES.find(id => C.disp(id) === 'review') || 'prodCode');
}
function rvCommit(e, id) {
  const f = e.flow, w = S.wf(e, LOOP_OF[id]); f.rev.pend = f.rev.pend || {};
  if (id === 'shell' && (f.st[id] === 'running' || f.st[id] === 'empty')) { f.rev.pend[id] = true; return; }
  if (f.st[id] !== 'review') return;
  ovLock(e, id); if (w) w.updated = dLong();
  if (id === 'toc' && f.st.shell === 'empty') { ovRun(e, 'shell'); toast('TOC locked, Shell generation started'); }
}
function rvCrumb(e, w) {
  const s = S.study(e.studyId);
  return crumbStudy(s, false) + crumbEvent(e) + `<span class="sep" aria-hidden="true"></span><a href="${hrefEvent(e.id, 'workflow')}">Workflow</a>` + (w ? `<span class="sep" aria-hidden="true"></span><b><a href="${hrefWf(e.id, w.id)}">${esc(w.id)}</a></b>` : '');
}
function pReview(e) {
  const f = e.flow, step = rvStep(e), node = rvNode(e, step), w = S.wf(e, LOOP_OF[node]);
  const st = f.st[node], pending = ['empty', 'running'].includes(st);
  if (pending) {
    const body = st === 'running' ? genState(NODE_LBL[node], f.prog[node]) : emptyState(NODE_LBL[node] + ' is not generated yet', 'Start it from the workflow page.', `<a class="btn" href="${w ? hrefWf(e.id, w.id, node) : hrefEvent(e.id, 'workflow')}">Open Workflow</a>`);
    return { label: 'Review', tabs: '', crumb: rvCrumb(e, w), body };
  }
  const C = ovCtx(e), codeNode = CODE_NODES.find(id => C.disp(id) === 'review') || (step === 'code' ? node : CODE_NODES.find(id => f.st[id] !== 'empty') || 'prodCode');
  const cs = f.st[codeNode], cw = { empty: 'Code is not generated yet. Start it from the Overview or Workflow page.', running: 'Code is still generating. Review opens when it finishes.', locked: 'Locked', stale: 'Code needs an update first. Use Update on the Overview.' }[cs] || '';
  const init = {
    step: RV_STEP[step], node, codeNode, event: e.name, wf: w ? w.id : '',
    hrefEvent: hrefEvent(e.id, 'overview'), hrefWorkflow: hrefEvent(e.id, 'workflow'), hrefWf: w ? hrefWf(e.id, w.id, node) : hrefEvent(e.id, 'workflow'),
    recent: DB.recent.map(id => S.event(id)).filter(Boolean).slice(0, 3).map(x => ({ name: x.name, study: x.studyId, cur: x.id === e.id, href: hrefEvent(x.id, 'overview') })),
    tocSt: f.st.toc, shellSt: f.st.shell,
    crumb: { study: e.studyId, studyHref: hrefStudy(e.studyId, 'events'), studies: DB.studies.map(x => ({ name: x.id, href: hrefStudy(x.id, 'events'), cur: x.id === e.studyId })), events: S.eventsOf(e.studyId).map(x => ({ name: x.name, href: hrefEvent(x.id, 'overview'), cur: x.id === e.id })) },
    resultView: step === 'code' && /Result$/.test(codeNode), lockable: cs === 'review', lockWhy: cw, lbLocked: cs === 'locked', snap: UI.rvSnap[e.id] || null
  };
  UI.rvFrame = { eid: e.id, codeNode };
  const doc = RV_DOC.replace('__INIT__', () => JSON.stringify(init).replace(/</g, '\\u003c'));
  return { frame: `<iframe id="rvf" class="rvf" title="Review" srcdoc="${esc(doc)}"></iframe>` };
}
window.addEventListener('message', ev => {
  const d = ev.data, fr = $('#rvf'); if (!d || d.rv !== 1 || !fr || ev.source !== fr.contentWindow || !UI.rvFrame) return;
  const e = S.event(UI.rvFrame.eid); if (!e) return;
  if (d.t === 'go') location.hash = d.hash;
  else if (d.t === 'commit') rvCommit(e, d.node === 'toc' || d.node === 'shell' ? d.node : UI.rvFrame.codeNode);
  else if (d.t === 'snap') UI.rvSnap[e.id] = d.s;
  else if (d.t === 'step') history.replaceState(null, '', hrefReview(e.id, d.step === 'lb' ? 'code' : d.step, d.step === 'lb' ? UI.rvFrame.codeNode : null));
});

/* ---------------- actions ---------------- */
Object.assign(A, {
  'wf.new': () => { openNewWorkflow(S.event(R.eid)); return false; },

  'ov.jumpWf': a => { const w = a ? S.wf(S.event(R.eid), a) : null; go(hrefEvent(R.eid, 'workflow'), w ? { hl: { kind: 'wf', id: w.id } } : null); return false; }
});

/* boot */
if (!location.hash) { history.replaceState(null, '', '#/studies'); }
onRoute();
