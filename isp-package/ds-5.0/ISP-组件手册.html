/* ISP foundation proposal. Source values reviewed from the supplied design reference.
   Light mode only. All tokens are scoped under .isp-theme. */
.isp-theme {
  --isp-color-primary: var(--isp-brand-blue-70);
  --isp-color-primary-hover: var(--isp-brand-blue-80);
  --isp-color-primary-active: var(--isp-brand-blue-90);
  --isp-color-primary-soft: var(--isp-brand-blue-10);
  --isp-color-on-primary: var(--isp-white);
  --isp-color-text-primary: var(--isp-gray-90);
  --isp-color-text-secondary: var(--isp-gray-80);
  --isp-color-text-muted: var(--isp-gray-70);
  --isp-color-text-disabled: var(--isp-gray-60);
  --isp-color-text-link: var(--isp-brand-blue-70);
  --isp-color-page: var(--isp-gray-20);
  --isp-color-surface: var(--isp-white);
  --isp-color-surface-sunken: var(--isp-gray-30);
  --isp-color-surface-hover: var(--isp-gray-20);
  --isp-color-surface-selected: var(--isp-brand-blue-10);
  --isp-color-border-subtle: var(--isp-gray-40);
  --isp-color-border-default: var(--isp-gray-50);
  --isp-color-border-strong: var(--isp-gray-60);
  --isp-color-focus: var(--isp-brand-blue-70);
  --isp-color-error: var(--isp-signal-error);
  --isp-color-warning: var(--isp-signal-warning);
  --isp-color-success: var(--isp-signal-success);

  --isp-font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  --isp-font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --isp-text-page-title: 32px;
  --isp-text-section-title: 24px;
  --isp-text-subsection-title: 18px;
  --isp-text-component-title: 16px;
  --isp-text-body: 14px;
  --isp-text-compact: 13px;
  --isp-text-caption: 12px;
  --isp-text-label: 11px;
  --isp-line-height-tight: 1.2;
  --isp-line-height-normal: 1.5;
  --isp-weight-regular: 400;
  --isp-weight-medium: 500;
  --isp-weight-semibold: 600;

  --isp-space-1: 4px;
  --isp-space-2: 8px;
  --isp-space-3: 12px;
  --isp-space-4: 16px;
  --isp-space-6: 24px;
  --isp-space-8: 32px;
  --isp-space-12: 48px;
  --isp-space-16: 64px;
  --isp-radius-control: 8px;
  --isp-radius-card: 16px;
  --isp-shadow-card: 1px 2px 6px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06);
  --isp-shadow-raised: 0 3px 8px rgba(0,0,0,.05), 1px 2px 4px rgba(0,0,0,.08);
  --isp-shadow-popover: 0 8px 24px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);

  /* Complete light-mode solid palette. */
  --isp-white: #FFFFFF;
  --isp-black: #000000;
  /* Brand Blue */
  --isp-brand-blue-100: #001E56;
  --isp-brand-blue-90: #052477;
  --isp-brand-blue-80: #003AA3;
  --isp-brand-blue-70: #0049CD;
  --isp-brand-blue-60: #2C6EE7;
  --isp-brand-blue-50: #4383F7;
  --isp-brand-blue-40: #89B0FB;
  --isp-brand-blue-30: #B6CFFF;
  --isp-brand-blue-20: #DCE9FF;
  --isp-brand-blue-10: #F5F8FE;
  /* Grey */
  --isp-gray-100: #000000;
  --isp-gray-90: #333333;

/* ISP Copilot Markdown styling. Requires isp-foundations.css on an ancestor .isp-theme. */
.isp-markdown {
  color: var(--isp-color-text-primary);
  font: 400 var(--isp-text-body)/var(--isp-line-height-normal) var(--isp-font-ui);
  overflow-wrap: anywhere;
}
.isp-markdown > :first-child { margin-top: 0; }
.isp-markdown > :last-child { margin-bottom: 0; }
.isp-markdown h1, .isp-markdown h2, .isp-markdown h3 { line-height: 1.35; }
.isp-markdown h1 { font-size: 16px; font-weight: 600; margin: 0 0 10px; }
.isp-markdown h2 { font-size: 14px; font-weight: 600; margin: 0 0 6px; }
.isp-markdown h3 { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
.isp-markdown p { margin: 0 0 8px; }
.isp-markdown strong { font-weight: 600; }
.isp-markdown del { color: var(--isp-color-text-secondary); }
.isp-markdown a { color: var(--isp-color-primary); text-decoration: none; }
.isp-markdown a:hover, .isp-markdown a:focus-visible { text-decoration: underline; }
.isp-markdown :not(pre) > code {
  font: 400 var(--isp-text-compact)/1.4 var(--isp-font-mono);
  color: var(--isp-color-primary);
  background: var(--isp-color-primary-soft);
  border-radius: 4px;
  padding: 2px 4px;
}
.isp-markdown blockquote {
  margin: 0 0 10px;
  padding: 8px 12px;
  border-left: 3px solid var(--isp-color-primary);
  border-radius: 0 8px 8px 0;
  background: var(--isp-color-page);
}
.isp-markdown blockquote > :last-child { margin-bottom: 0; }
.isp-markdown ul, .isp-markdown ol { margin: 0 0 10px; padding-left: 20px; }
.isp-markdown li + li { margin-top: 4px; }
.isp-markdown li > p { margin-bottom: 0; }
.isp-markdown input[type='checkbox'] { accent-color: var(--isp-color-primary); }
.isp-markdown hr { border: 0; border-top: 1px solid var(--isp-color-border-subtle); margin: 10px 0; }
.isp-markdown .isp-markdown-table {
  overflow-x: auto;
  margin: 0 0 10px;
  border: 1px solid var(--isp-color-border-subtle);
  border-radius: 8px;
}
.isp-markdown table { border-collapse: collapse; min-width: max-content; width: 100%; font-size: var(--isp-text-compact); }
.isp-markdown th, .isp-markdown td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--isp-color-border-subtle); }
.isp-markdown th { background: var(--isp-color-page); font-weight: 600; white-space: nowrap; }
.isp-markdown tr:last-child td { border-bottom: 0; }
.isp-markdown pre {
  margin: 0 0 10px;
  padding: 10px 12px;
  overflow-x: auto;
  border: 1px solid var(--isp-color-border-subtle);
  border-radius: 8px;
  background: var(--isp-color-page);
  font: 400 var(--isp-text-caption)/1.5 var(--isp-font-mono);
}
.isp-markdown pre code { font: inherit; white-space: pre; }
.isp-markdown .isp-callout {
  margin: 0 0 10px;
  padding: 10px 12px;
  border: 1px solid var(--isp-color-border-subtle);
  border-left: 3px solid var(--isp-color-primary);
  background: var(--isp-color-page);
}
.isp-markdown .isp-callout[data-tone='tip'] { border-left-color: var(--isp-color-success); }
.isp-markdown .isp-callout[data-tone='warning'] { border-left-color: var(--isp-color-warning); }
.isp-markdown .isp-callout[data-tone='caution'] { border-left-color: var(--isp-color-error); }

/* ISP Copilot review components. Requires .isp-theme and Remix Icon. */
.isp-copilot-panel{width:min(100%,520px);height:610px;display:flex;flex-direction:column;border:1px solid var(--isp-color-border-subtle);border-radius:var(--isp-radius-card);background:var(--isp-color-surface);overflow:hidden;box-shadow:var(--isp-shadow-card)}
.isp-copilot-panel-head{display:flex;align-items:center;justify-content:space-between;padding:var(--isp-space-3) var(--isp-space-4);border-bottom:1px solid var(--isp-color-border-subtle)}
.isp-copilot-panel-head strong{font-size:var(--isp-text-component-title);font-weight:var(--isp-weight-semibold)}
.isp-copilot-panel-head span{font-size:var(--isp-text-caption);color:var(--isp-color-text-secondary)}
.isp-copilot-messages{display:flex;flex-direction:column;gap:var(--isp-space-4);flex:1;min-height:0;overflow-y:auto;padding:var(--isp-space-4);background:var(--isp-color-surface)}
.isp-copilot-message{max-width:100%}
.isp-copilot-message.user{align-self:flex-end;max-width:88%;padding:var(--isp-space-3);border:1px solid var(--isp-brand-blue-30);border-radius:var(--isp-radius-control);background:var(--isp-brand-blue-20)}
.isp-copilot-message p{margin:0}
.isp-copilot-footer{padding:var(--isp-space-3);background:var(--isp-color-surface);border-top:1px solid var(--isp-color-border-subtle)}
.isp-copilot-composer{display:flex;flex-direction:column;justify-content:center;width:100%;padding:8px;border:1px solid var(--isp-color-border-subtle);border-radius:var(--isp-radius-control);background:var(--isp-color-surface);transition:border-color .2s,box-shadow .2s}
.isp-copilot-composer.is-multiline{border-radius:6px}
.isp-copilot-composer.text-only:not(.is-multiline){min-height:40px}
.isp-copilot-composer.text-only:focus-within{border-color:var(--isp-color-primary);box-shadow:0 0 6px rgba(0,0,0,.1)}
.isp-copilot-composer.with-images:focus-within{border-color:var(--isp-color-primary);box-shadow:0 0 0 1px var(--isp-color-primary)}
.isp-copilot-composer-row{display:flex;align-items:center;gap:16px;width:100%}
.isp-copilot-composer.is-multiline .isp-copilot-composer-row{align-items:flex-end;gap:10px}
.isp-copilot-composer.with-images .isp-copilot-composer-row{padding-bottom:4px}
.isp-copilot-composer textarea{flex:1;min-width:0;min-height:24px;max-height:140px;padding:0;resize:none;overflow-y:auto;border:0;outline:0;background:transparent;color:var(--isp-color-text-primary);font:400 var(--isp-text-body)/var(--isp-line-height-normal) var(--isp-font-ui)}
.isp-copilot-composer textarea:disabled{cursor:not-allowed}
.isp-copilot-send{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none;border:0;border-radius:var(--isp-radius-xs);background:var(--isp-color-primary);color:var(--isp-color-on-primary);cursor:pointer}
.isp-copilot-send:hover:not(:disabled){background:var(--isp-color-primary-hover)}
.isp-copilot-send:disabled{background:var(--isp-color-border-default);cursor:not-allowed}
.isp-copilot-diff,.isp-copilot-error{border:1px solid var(--isp-color-border-subtle);border-radius:var(--isp-radius-control);background:var(--isp-color-surface);overflow:hidden}
.isp-copilot-diff-head{display:flex;align-items:center;gap:var(--isp-space-2);width:100%;min-height:44px;padding:0 var(--isp-space-3);border:0;background:transparent;color:var(--isp-color-text-primary);text-align:left;cursor:pointer}
.isp-copilot-diff-head:hover{background:var(--isp-color-page)}
.isp-copilot-diff-head strong{font-size:var(--isp-text-body);font-weight:var(--isp-weight-medium)}
.isp-copilot-diff-head>.ri-arrow-right-s-line,.isp-copilot-diff-head>.ri-arrow-down-s-line{margin-left:auto}
.isp-copilot-diff-count{font-size:var(--isp-text-caption);font-family:var(--isp-font-mono);color:var(--isp-color-text-secondary)}
.isp-copilot-diff-count .added{color:var(--isp-color-success)}
.isp-copilot-diff-count .removed{color:var(--isp-color-error)}
.isp-copilot-diff-lines{max-height:240px;overflow:auto;border-top:1px solid var(--isp-color-border-subtle)}
.isp-copilot-diff-line{display:flex;gap:var(--isp-space-2);min-width:max-content;padding:var(--isp-space-1) var(--isp-space-2);border-left:3px solid transparent;font:400 var(--isp-text-compact)/1.5 var(--isp-font-mono)}
.isp-copilot-diff-line.removed{background:var(--isp-red-10);border-left-color:var(--isp-color-error)}
.isp-copilot-diff-line.added{background:var(--isp-green-10);border-left-color:var(--isp-color-success)}
.isp-copilot-diff-line.removed>span{color:var(--isp-color-error);font-weight:var(--isp-weight-semibold)}
.isp-copilot-diff-line.added>span{color:var(--isp-color-success);font-weight:var(--isp-weight-semibold)}
.isp-copilot-diff-line code{white-space:pre}
.isp-copilot-error{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--isp-space-3);padding:var(--isp-space-2) var(--isp-space-3);border-color:var(--isp-red-30);background:var(--isp-red-10);color:var(--isp-color-error)}
.isp-copilot-error-main{display:flex;gap:var(--isp-space-2);min-width:0}
.isp-copilot-error-main>div{min-width:0}
.isp-copilot-error strong{display:block;font-size:var(--isp-text-compact);font-weight:var(--isp-weight-semibold)}
.isp-copilot-error-main button{display:flex;align-items:center;gap:var(--isp-space-1);margin-top:var(--isp-space-1);padding:0;border:0;background:transparent;color:inherit;font-size:var(--isp-text-caption);cursor:pointer}
.isp-copilot-error p{margin:var(--isp-space-2) 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:var(--isp-text-caption)}
.isp-copilot-retry{display:flex;align-items:center;gap:var(--isp-space-1);padding:var(--isp-space-1) var(--isp-space-2);border:1px solid var(--isp-red-30);border-radius:var(--isp-radius-xs);background:var(--isp-color-surface);color:var(--isp-color-error);font-size:var(--isp-text-caption);cursor:pointer}
.isp-copilot-retry:hover{background:var(--isp-color-page)}
.isp-copilot-status{display:flex;align-items:center;gap:var(--isp-space-2);padding:var(--isp-space-2);font-size:var(--isp-text-compact);color:var(--isp-color-text-secondary)}
.isp-copilot-spinner{width:15px;height:15px;border:2px solid var(--isp-color-border-default);border-top-color:var(--isp-color-primary);border-radius:50%;animation:isp-spin .8s linear infinite}
@keyframes isp-spin{to{transform:rotate(360deg)}}
.isp-copilot-review-grid{display:grid;grid-template-columns:minmax(320px,520px) minmax(280px,1fr);gap:var(--isp-space-4);align-items:start}
.isp-copilot-review-stack{display:grid;gap:var(--isp-space-3);min-width:0}
.isp-copilot-markdown-demo{max-width:720px}
.isp-copilot-markdown-demo .isp-markdown{padding:var(--isp-space-4);border:1px solid var(--isp-color-border-subtle);border-radius:var(--isp-radius-control);background:var(--isp-color-surface)}
.isp-copilot-code-block{margin:0 0 var(--isp-space-3);border:1px solid var(--isp-color-border-subtle);border-radius:var(--isp-radius-control);overflow:hidden}
.isp-copilot-code-block-head{display:flex;align-items:center;gap:var(--isp-space-1);padding:var(--isp-space-2) var(--isp-space-3);border-bottom:1px solid var(--isp-color-border-subtle);background:var(--isp-color-page);font:var(--isp-text-caption) var(--isp-font-mono)}
.isp-copilot-code-block pre{margin:0;border:0;border-radius:0}
.isp-copilot-review-note{font-size:var(--isp-text-caption);color:var(--isp-color-text-secondary);margin:var(--isp-space-3) 0 0}
@media(max-width:920px){.isp-copilot-review-grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.isp-copilot-spinner{animation:none}}

.isp-copilot-attachments{display:flex;flex-wrap:wrap;gap:8px;width:100%;padding-bottom:8px}
.isp-copilot-attachment{position:relative;flex:none;width:48px;height:48px}
.isp-copilot-attachment img{display:block;width:48px;height:48px;object-fit:cover;border:1px solid var(--isp-color-border-subtle);border-radius:var(--isp-radius-xs)}
.isp-copilot-attachment button,.isp-copilot-attachment span{position:absolute;top:-5px;left:-5px;display:flex;align-items:center;justify-content:center;width:16px;height:16px;border:0;border-radius:50%;background:var(--isp-color-primary);color:var(--isp-color-on-primary);font-size:9px}
.isp-copilot-attachment button{z-index:1;opacity:0;cursor:pointer}
.isp-copilot-attachment:hover button,.isp-copilot-attachment button:focus-visible{opacity:1}
.isp-copilot-composer-tools{display:flex;align-items:center;justify-content:space-between;width:100%;padding-top:4px}
.isp-copilot-composer-tools>button:not(.isp-copilot-send){display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;padding:0;border:0;border-radius:var(--isp-radius-xs);background:transparent;color:var(--isp-color-text-secondary);cursor:pointer}
.isp-copilot-composer-tools>button:not(.isp-copilot-send):hover:not(:disabled){background:var(--isp-color-primary-soft);color:var(--isp-color-text-primary)}
.isp-copilot-composer-tools>button:disabled{cursor:not-allowed;opacity:.5}
.isp-copilot-composer-error{margin:0;color:var(--isp-color-error);font-size:var(--isp-text-caption)}
/* Thinking process trace. */
.isp-copilot-thinking-process{display:flex;flex-direction:column;gap:12px;width:100%;max-width:100%;margin:4px 0;overflow-x:hidden}
.isp-copilot-trace-section{display:flex;flex-direction:column;min-width:0}
.isp-copilot-trace-head{display:inline-flex;align-items:center;gap:8px;width:fit-content;max-width:100%;padding:4px 8px;border:0;border-radius:6px;background:transparent;color:var(--isp-color-text-secondary);font:var(--isp-weight-regular) var(--isp-text-body)/var(--isp-line-height-normal) var(--isp-font-ui);cursor:pointer}
.isp-copilot-trace-head:hover{background:var(--isp-color-primary-soft);color:var(--isp-color-text-primary)}
.isp-copilot-trace-head.is-active .isp-copilot-trace-icon{color:var(--isp-color-primary)}
.isp-copilot-trace-head>i:last-child{flex:none;transition:transform .15s}
.isp-copilot-trace-head>i:last-child.is-open{transform:rotate(90deg)}
.isp-copilot-trace-icon{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;flex:none;line-height:1}
.isp-copilot-trace-icon i{font-size:14px;line-height:1}
.isp-copilot-trace-wrap{position:relative;min-width:0;overflow:hidden}
.isp-copilot-trace-scroll{display:flex;flex-direction:column;gap:2px;width:100%;padding:4px 0 6px;overflow-x:hidden;overflow-y:auto}
.isp-copilot-trace-scroll.reasoning{gap:8px}
.isp-copilot-trace-row{display:flex;align-items:center;gap:8px;min-width:0;min-height:22px;padding:0 8px;color:var(--isp-color-text-secondary);font:var(--isp-weight-regular) var(--isp-text-body)/var(--isp-line-height-normal) var(--isp-font-ui)}
.isp-copilot-trace-row>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.isp-copilot-trace-reason{padding:0 8px;color:var(--isp-color-text-secondary);font:var(--isp-weight-regular) var(--isp-text-body)/var(--isp-line-height-normal) var(--isp-font-ui);overflow-wrap:anywhere}
.isp-copilot-trace-mask{position:absolute;left:0;right:8px;z-index:1;pointer-events:none;opacity:0;transition:opacity .2s}
.isp-copilot-trace-mask.visible{opacity:1}
.isp-copilot-trace-mask.top{top:0;height:12px;background:linear-gradient(to bottom,var(--isp-trace-surface,var(--isp-color-surface)),transparent)}
.isp-copilot-trace-mask.bottom{bottom:0;height:18px;background:linear-gradient(to top,var(--isp-trace-surface,var(--isp-color-surface)),transparent)}
.isp-copilot-composer-variant{display:grid;gap:var(--isp-space-2);max-width:520px}
.isp-copilot-composer-variant>strong{font-size:var(--isp-text-compact)}

.isp-copilot-stop{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none;padding:0;border:0;border-radius:var(--isp-radius-xs);background:transparent;color:var(--isp-color-primary);cursor:pointer}
.isp-copilot-stop:hover:not(:disabled){background:var(--isp-color-primary-soft)}
.isp-copilot-stop:disabled{color:var(--isp-color-text-secondary);cursor:not-allowed}
.isp-copilot-process-working{background:linear-gradient(90deg,var(--isp-color-primary) 20%,var(--isp-brand-blue-40) 50%,var(--isp-color-primary) 80%);background-size:200% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:isp-process-shimmer 1.4s linear infinite}
@keyframes isp-process-shimmer{to{background-position:-200% 0}}

.isp-copilot-pending{display:flex;flex-direction:column;gap:4px;width:100%;padding:8px 2px 2px;border:1px solid var(--isp-brand-blue-20);border-radius:10px;background:var(--isp-color-primary-soft)}

.isp-copilot-pending-list{display:grid;gap:4px;max-height:140px;overflow:auto;padding:0 8px 6px}

.isp-copilot-pending-input input{flex:1;min-width:0;padding:0;border:0;outline:0;background:transparent;color:var(--isp-color-text-primary);font-size:var(--isp-text-body)}

.isp-copilot-pending-input button:disabled{background:var(--isp-color-border-default);cursor:not-allowed}

.isp-copilot-catalog-preview .isp-copilot-thinking-process{--isp-trace-surface:var(--isp-color-page)}

/* Event Copilot batch cards. */

.isp-event-scope-row:last-child,.isp-event-progress-row:last-child,.isp-event-summary-row:last-child{border-bottom:0}

.isp-event-check{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;flex:none;padding:0;border:1px solid var(--isp-color-border-default);border-radius:3px;background:var(--isp-color-surface);cursor:pointer}

.isp-event-item-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.isp-event-card-footer{display:flex;justify-content:flex-end;gap:8px;padding:8px 12px;border-top:1px solid var(--isp-color-border-subtle);background:var(--isp-color-page)}
.isp-event-card-footer button,.isp-event-summary-row button{display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:0 10px;border:1px solid var(--isp-color-border-default);border-radius:var(--isp-radius-xs);background:var(--isp-color-surface);color:var(--isp-color-text-primary);font-size:12px;cursor:pointer}

.isp-event-card-footer button:disabled{opacity:.5;cursor:not-allowed}
.isp-event-progress-row{gap:10px;min-height:48px;padding:7px 8px}
.isp-event-progress-copy{display:flex;flex:1;flex-direction:column;min-width:0}
.isp-event-progress-copy strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500}
.isp-event-progress-copy small{color:var(--isp-color-text-secondary);font-size:11px}
.isp-event-progress-row.status-running .isp-event-progress-copy strong,.isp-event-progress-row.status-stopping .isp-event-progress-copy strong{color:var(--isp-color-primary)}

.isp-event-progress-row.status-failed>i:first-child{color:var(--isp-color-error)}
.isp-event-progress-row.status-blocked>i:first-child{color:var(--isp-color-warning)}

.isp-event-progress-row:hover .isp-event-item-stop,.isp-event-item-stop:focus-visible{opacity:1}
.isp-event-input-progress{display:flex;flex-direction:column;min-width:0}

.isp-event-input-progress-list{max-height:180px;overflow-y:auto;padding:0 4px 4px}
.isp-event-input-progress-list .isp-event-progress-row{border:0;border-radius:6px;padding:5px 8px}
.isp-event-input-progress-list .isp-event-progress-row:hover{background:var(--isp-color-surface)}
.isp-event-summary-row>div{display:flex;flex:1;flex-direction:column;min-width:0}
.isp-event-summary-row strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500}

.isp-event-summary-row.status-failed>i:first-child,.isp-event-summary-row.status-failed>span:last-child{color:var(--isp-color-error)}
.isp-event-summary-row.status-blocked>i:first-child{color:var(--isp-color-warning)}
.isp-event-dispatched{display:flex;flex-direction:column;gap:6px;max-width:520px}

.isp-event-dispatched-message{padding:8px 10px;border-radius:var(--isp-radius-control);background:var(--isp-color-primary);color:var(--isp-color-on-primary);font-size:14px;white-space:pre-wrap;box-shadow:var(--isp-shadow-card)}

.isp-code-editor{position:relative;width:100%;max-height:520px;overflow:hidden;border:1px solid var(--isp-color-border-subtle);background:var(--isp-color-surface);color:var(--isp-color-text-primary)}

.isp-code-gutter{position:sticky;left:0;z-index:2;flex:none;width:58px;padding:16px 4px 16px 8px;background:var(--isp-color-surface);text-align:right;user-select:none}

.isp-shell-footnotes{display:grid;gap:4px;margin-top:var(--isp-space-4);color:var(--isp-color-text-secondary);font-size:10px;line-height:14px}

.isp-shell-figure-paper{width:940px;min-width:940px}

.zq5-tools{flex:none;height:40px;padding:0 12px;display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--isp-color-border-subtle)}
.zq5-tsep{width:1px;height:16px;margin:0 var(--isp-space-1);background:var(--isp-color-border-default)}
.zq5-panel>.zq5-head{border-bottom:1px solid var(--isp-color-border-subtle)}
.zq5-panel>.zq5-head+.zq5-tools{border-top:0}
.zq5-head-demo .zq5-head{border-bottom:0}
/* Outline */
.zq5-ofil{position:relative;display:flex;align-items:center;gap:var(--isp-space-1);padding:var(--isp-space-2)}
.zq5-fmenu{left:var(--isp-space-2);top:44px;width:196px}
.zq5-mck{width:16px;display:inline-flex;flex:none}
.zq5-mt{flex:1}
.zq5-mn{color:var(--isp-color-text-secondary);font-size:var(--isp-text-caption);font-variant-numeric:tabular-nums}
.zq5-obody{flex:1;min-height:0;overflow:auto;padding:var(--isp-space-2);display:flex;flex-direction:column;gap:2px}
.zq5-og{display:flex;flex-direction:column;gap:2px}
.zq5-ogh,.zq5-oi{width:100%;height:28px;display:flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:var(--isp-radius-control);text-align:left;font:var(--isp-weight-regular) var(--isp-text-caption) var(--isp-font-ui);color:var(--isp-color-text-primary);min-width:0;cursor:pointer;flex:none}
.zq5-ogh{font-weight:var(--isp-weight-semibold);padding:0 var(--isp-space-2) 0 2px}
.zq5-oi{padding:0 var(--isp-space-2) 0 24px}
.zq5-ogh:hover,.zq5-oi:hover{background:var(--isp-brand-blue-10)}
.zq5-oi.is-cur{background:var(--isp-color-primary-soft);color:var(--isp-color-primary);font-weight:var(--isp-weight-medium)}
.zq5-oi.is-cur .zq5-ty,.zq5-oi.is-cur .zq5-on{color:var(--isp-color-primary)}
.zq5-oi[aria-disabled="true"]{cursor:default}
.zq5-ot{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zq5-on{flex:none;color:var(--isp-color-text-secondary);font-variant-numeric:tabular-nums}
.zq5-ty{flex:none;display:inline-block;width:14px;height:14px;background:currentColor;color:var(--isp-color-text-secondary);mask-size:contain;mask-position:center;mask-repeat:no-repeat;-webkit-mask-size:contain;-webkit-mask-position:center;-webkit-mask-repeat:no-repeat}
.zq5-sx{display:inline-flex;flex:none;align-items:center;justify-content:flex-end;min-width:14px;margin-left:auto;color:var(--isp-color-text-secondary)}
.zq5-sx.is-strong{color:var(--isp-color-text-primary)}
.zq5-dot{width:6px;height:6px;border-radius:50%;background:var(--isp-yellow-50)}
.zq5-ocnt{margin-left:auto;font-size:var(--isp-text-label);color:var(--isp-color-text-secondary);font-variant-numeric:tabular-nums}
/* 占位与文档桌面 */
.zq5-ph{display:grid;place-items:center;min-height:96px;border:1px dashed var(--isp-color-border-default);border-radius:var(--isp-radius-control);color:var(--isp-color-text-secondary);font-size:var(--isp-text-compact)}
.zq5-ph.is-row{min-height:56px;margin-bottom:var(--isp-space-2)}
.zq5-desk{background:var(--isp-color-surface-sunken);padding:var(--isp-space-6) var(--isp-space-6) var(--isp-space-2)}
.zq5-scroll>.zq5-desk:last-child{padding-bottom:var(--isp-space-6)}
.zq5-paper{max-width:640px;margin:0 auto var(--isp-space-6);background:var(--isp-color-surface);border:1px solid var(--isp-color-border-subtle);padding:var(--isp-space-8) var(--isp-space-12);display:flex;flex-direction:column;gap:var(--isp-space-3);min-height:240px}
.zq5-skel{height:10px;border-radius:var(--isp-radius-full);background:var(--isp-color-surface-sunken);flex:none}
.zq5-skel.is-short{width:55%}
.zq5-skel.is-link{background:transparent;border-bottom:2px dotted var(--isp-brand-blue-40);border-radius:0;height:12px}
.zq5-skel.is-sel{background:var(--isp-color-surface-selected-strong)}
/* Comment 模式与浮条 */
.zq5-cm [data-cm]:hover{outline:2px dashed var(--isp-brand-blue-70);outline-offset:-2px;cursor:crosshair}
.zq5-cmbar{position:absolute;left:50%;bottom:var(--isp-space-4);transform:translateX(-50%);z-index:60;width:440px;max-width:calc(100% - 32px);background:var(--isp-color-surface);border:1px solid var(--isp-color-border-subtle);border-radius:var(--isp-radius-md);box-shadow:var(--isp-shadow-popover);padding:var(--isp-space-2) var(--isp-space-2) var(--isp-space-2) var(--isp-space-3);display:flex;flex-direction:column;gap:6px;box-sizing:border-box}
.zq5-cmh{display:flex;align-items:center;gap:var(--isp-space-2);height:28px;font-size:var(--isp-text-compact)}
.zq5-cml{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow:auto}
.zq5-cmi{display:flex;align-items:center;gap:6px}
.zq5-cmc{flex:none;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--isp-text-caption);background:var(--isp-color-surface-selected-strong);border-radius:var(--isp-radius-xs);padding:2px 6px}
.zq5-cmf{flex:1;min-width:0;height:28px;border:1px solid var(--isp-color-border-default);border-radius:var(--isp-radius-control);padding:0 var(--isp-space-2);font:var(--isp-text-compact) var(--isp-font-ui);color:var(--isp-color-text-primary);background:var(--isp-color-surface)}
.zq5-cmr{display:flex;justify-content:flex-end;gap:var(--isp-space-2)}
/* Nav 的 Recent events：标题单行省略 */
.lp-recent-item b{font-weight:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-recent-item small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
